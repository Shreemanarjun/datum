name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  datum:
    name: datum (analyze · format · generate · test · benchmark)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/datum
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install workspace dependencies
        working-directory: .
        run: flutter pub get

      - name: Generate code
        # *.g.dart is gitignored (only test fixtures are generated), so CI must
        # produce it fresh before analysis can resolve the part files.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (fatal on infos & warnings)
        # Scoped to the package sources; the bundled example app is a separate
        # demo package with its own (looser) lint baseline.
        run: dart analyze --fatal-infos --fatal-warnings lib test benchmark

      - name: Format check (hand-written sources only)
        run: >-
          dart format --output=none --set-exit-if-changed
          $(find lib test benchmark -name '*.dart' ! -name '*.g.dart')

      - name: Test
        run: flutter test

      - name: Benchmark smoke run
        run: dart run benchmark/datum_benchmark.dart --scale=1

  datum_hive:
    name: datum_hive (analyze · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/datum_hive
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        # datum_hive is not a workspace member (it needs the Flutter SDK, which
        # the pure-Dart workspace avoids) — resolve it in its own directory.
        run: flutter pub get
      - run: dart analyze --fatal-infos --fatal-warnings
      - run: flutter test

  datum_generator:
    name: datum_generator (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/datum_generator
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install workspace dependencies
        working-directory: .
        run: flutter pub get
      - run: dart analyze
