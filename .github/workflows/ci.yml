name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  datum:
    name: datum (analyze · format · generate · test · benchmark)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/datum
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      - name: Install workspace dependencies
        working-directory: .
        run: dart pub get

      - name: Generate code
        # *.g.dart is gitignored (only test fixtures are generated), so CI must
        # produce it fresh before analysis can resolve the part files.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (fatal on infos & warnings)
        # Scoped to the package sources; the bundled example app is a separate
        # Flutter demo package with its own (looser) lint baseline.
        run: dart analyze --fatal-infos --fatal-warnings lib test benchmark

      - name: Format check (hand-written sources only)
        run: >-
          dart format --output=none --set-exit-if-changed
          $(find lib test benchmark -name '*.dart' ! -name '*.g.dart')

      - name: Test
        run: dart test

      - name: Benchmark smoke run
        run: dart run benchmark/sync_benchmark.dart --runs 1

  workspace:
    name: ${{ matrix.package }} (analyze · test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [datum_sqlite, datum_test, datum_generator]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install workspace dependencies
        working-directory: .
        run: dart pub get
      - run: dart analyze --fatal-infos --fatal-warnings
      - run: dart test

  datum_hive:
    name: datum_hive (analyze · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/datum_hive
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        # Not a workspace member: it resolves the published datum constraint
        # with a local path override.
        run: dart pub get
      - run: dart analyze --fatal-infos --fatal-warnings
      - run: dart test

