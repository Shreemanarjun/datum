name: datum_hive
description: A Hive-based persistence layer for the Datum ecosystem, enabling efficient local data storage and synchronization for Flutter applications
version: 0.1.0

homepage: https://www.shreeman.dev
repository: https://github.com/Shreemanarjun/datum
issue_tracker: https://github.com/Shreemanarjun/datum/issues
documentation: https://datum.shreeman.dev/
funding:
  - https://buymeacoffee.com/shreemanarjun


topics:
  - offline-first
  - synchronization
  - database
  - flutter
  - supabase

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=1.17.0"



dependencies:
  collection: ^1.19.1
  datum: ^1.1.0
  hive_ce_flutter: ^2.3.3
  meta: ^1.16.0

dev_dependencies:
  datum_test:
    path: ../datum_test
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  mocktail: ^1.0.4

dependency_overrides:
  test_api: ^0.7.7
  # Local dev only — ignored by pub.dev consumers. Remove once datum 1.1.0 is published.
  datum:
    path: ../datum

flutter:
