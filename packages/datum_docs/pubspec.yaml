name: datum_docs
description: A documentation site built with Jaspr
version: 1.1.0
environment:
  sdk: '>=3.8.0 <4.0.0'


dependencies:

  http: ^1.5.0
  jaspr: ^0.23.4
  jaspr_content: ^0.5.4
  jaspr_lucide: ^0.55.0
  jaspr_riverpod: ^0.4.6
  jaspr_router: ^0.9.0
  syntax_highlight_lite: ^0.0.1
  universal_web: ^1.1.1+1


dev_dependencies:
  build_runner: ^2.10.4
  datum: ^1.1.0
  datum_hive: ^0.1.0
  datum_sqlite: ^0.1.0
  datum_test: ^0.1.0
  sqlite3: ^2.4.0
  test: ^1.25.6
  build_web_compilers: ^4.4.6
  jaspr_builder: ^0.23.4
  jaspr_lints: ^0.7.2
  lints: ^4.0.0


jaspr:
  mode: static

dependency_overrides:
  # datum_docs resolves standalone (its jaspr toolchain needs analyzer 12,
  # which the workspace's datum_generator cannot share). Ecosystem packages
  # resolve via path for snippet verification.
  datum:
    path: ../datum
  datum_hive:
    path: ../datum_hive
  datum_sqlite:
    path: ../datum_sqlite
  datum_test:
    path: ../datum_test
