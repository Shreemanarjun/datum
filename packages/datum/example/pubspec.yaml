name: example
description: ""
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  auto_route: ^10.2.0
  collection: ^1.19.1
  compute: ^1.0.2
  datum:
    path: ../

  datum_generator:
    path: ../../datum_generator
  dio: ^5.9.0
  dio_smart_retry: ^7.0.1
  duration: ^4.0.3
  equatable: ^2.0.7
  flash: ^3.1.1
  flex_color_scheme: ^8.3.0
  flutter:
    sdk: flutter

  flutter_displaymode: ^0.7.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage_x: ^11.3.0
  hive_ce_flutter: ^2.3.2
  internet_connection_checker_plus: ^2.9.0
  intl: ^0.20.2
  multiple_result: ^5.2.0
  path_provider: ^2.1.5
  platform_info: ^5.0.0
  recase: ^4.1.0
  responsive_framework:
    git: https://github.com/Shreemanarjun/ResponsiveFramework.git
  rxdart: ^0.28.0
  shadcn_ui: ^0.38.1
  slang: ^4.9.1
  slang_flutter: ^4.9.0
  supabase_flutter: ^2.10.3
  talker_dio_logger: ^5.0.2
  talker_flutter: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.2.5
  build_runner: ^2.7.1
  custom_lint: ^0.7.6
  # End-to-end integration tests (integration_test/) against a local sync
  # server, exercising both SQLite and Hive local adapters.
  datum_hive:
    path: ../../datum_hive
  datum_sqlite:
    path: ../../datum_sqlite
  datum_test:
    path: ../../datum_test
  flutter_lints: ^6.0.0
  hive_ce_test: ^2.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod_lint: ^2.6.5
  slang_build_runner: ^4.9.0
  sqlite3: ^2.4.0
  # Bundles the SQLite native library into the iOS/Android test app.
  sqlite3_flutter_libs: ^0.5.24

dependency_overrides:
  # The ecosystem packages declare hosted `datum`; the example always builds
  # against the local sources.
  datum:
    path: ../
  datum_generator:
    path: ../../datum_generator
  # datum_test's `package:test` and flutter_test pin different test_api /
  # matcher patch versions — same override family datum_hive uses.
  test_api: ^0.7.7
  matcher: ^0.12.16
  spot: ^0.16.0
  very_good_analysis: ^10.0.0


flutter:
  uses-material-design: true
